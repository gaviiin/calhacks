<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anneal Simplified Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: one slide. Headline, five-box flow with one model branch and one feedback loop, a short footer */
:root{
  --bg:#1D1D20; --bg2:#2A2626; --panel:#26262A; --hair:#34343A; --ink:#EEEDEA; --muted:#A8A6A1; --edge:#B9B6B0;
  --crash:#FF5E54; --rules:#3CCB8E; --rules-fill:#173527; --rules-ink:#A5EDCB;
  --ai:#5CB8F0; --ai-fill:#17334A; --ai-ink:#B5DFFA; --person:#FFB547; --person-fill:#4A3410; --person-ink:#FFDA9E;
  --chip:rgba(255,255,255,.09); --display:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 480px at 85% -5%,var(--bg2),transparent),linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:auto,48px 48px,48px 48px;
  color:var(--ink);font-family:var(--display);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:40px 48px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--crash)}
h1{font-size:clamp(28px,4.2vw,52px);line-height:1.08;font-weight:800;margin:10px 0 0;text-wrap:balance;letter-spacing:-.015em}
.stage{background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--hair);border-radius:22px;padding:22px;box-shadow:0 18px 40px -24px rgba(0,0,0,.6)}
.flow-scroll{overflow-x:auto}
svg.flow{width:100%;min-width:860px;height:auto;display:block}
svg text{font-family:var(--display)}
.nb{stroke-width:3} .rules .nb{fill:var(--rules-fill);stroke:var(--rules)} .ai .nb{fill:var(--ai-fill);stroke:var(--ai)} .person .nb{fill:var(--person-fill);stroke:var(--person);stroke-width:4.5}
.chipbg{fill:var(--chip)} .chipt{font-size:18px;font-weight:700}
.rules .chipt,.rules .cap{fill:var(--rules-ink)} .ai .chipt,.ai .cap{fill:var(--ai-ink)} .person .chipt,.person .cap{fill:var(--person-ink)}
.tt{font-size:28px;font-weight:800;fill:var(--ink)} .cap{font-size:20px;font-weight:500}
.carn{fill:var(--crash)} .ct{font-size:30px;font-weight:800;fill:#fff} .cc{font-size:22px;fill:#fff;opacity:.9}
.pulse{fill:none;stroke:var(--crash);stroke-width:3;transform-origin:130px 329px;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.4)}}
.edge{fill:none;stroke:var(--edge);stroke-width:3.5} .edge.ai{stroke:var(--ai)} .edge.cr{stroke:var(--crash)} .edge.fb{stroke:var(--muted);stroke-width:3} .edge.per{stroke:var(--person)}
.elab{font-size:21px;font-weight:600;fill:var(--muted)}
.foot{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
</head>
