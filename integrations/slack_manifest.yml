# Create the Slack app from this manifest: api.slack.com/apps -> Create New App -> From a manifest.
# Replace https://YOUR-PUBLIC-URL with your tunnel (e.g. `cloudflared tunnel --url http://localhost:8000`).
display_information:
  name: Pit Wall
  description: Meridian Racing's autonomous revenue accountant
  background_color: "#13151a"
features:
  bot_user:
    display_name: Pit Wall
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
settings:
  event_subscriptions:
    request_url: https://YOUR-PUBLIC-URL/integrations/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: https://YOUR-PUBLIC-URL/integrations/slack/actions
  org_deploy_enabled: false
  socket_mode_enabled: false
